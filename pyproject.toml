[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commentsearch"
version = "0.1.0"
description = "Local hybrid (dense + BM25) search over public comments"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "openpyxl",
    "scipy",
    "sentence-transformers",
    "bm25s",
    "nltk",
    "gradio",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
